<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Read Receipt – Upload</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./stlye.css">

</head>
<body>

  <div class="card">
    <header>
      <div class="label-tag">Receipt Scanner</div>
      <h1>Read<span>.</span>Receipt</h1>
    </header>

    <!-- ── Drop Zone ────────────────────────────────────── -->
    <div class="drop-zone" id="dropZone">
      <!-- Hidden real file input; covers the whole zone -->
      <input type="file" id="fileInput" name="file" accept="image/*,.pdf" />

      <span class="drop-icon">📄</span>
      <p class="drop-title">Drop your file here</p>
      <p class="drop-sub">or <span>browse to upload</span></p>
    </div>

    <!-- ── Selected file name ───────────────────────────── -->
    <p class="file-info" id="fileInfo">No file selected</p>

    <!-- ── Upload button ────────────────────────────────── -->
    <button class="btn-upload" id="uploadBtn" onclick="handleUpload()">
      ↑ &nbsp; Upload File
    </button>

    <p class="footer-note">Supported: PNG, JPG, PDF &nbsp;·&nbsp; Max 10 MB</p>
  </div>

  <script src="script.js"></script>

</body>
</html>
